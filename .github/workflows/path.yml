name: Test PATH in later steps
on:
  pull_request: null
  push: { branches-ignore: [v1] }
  workflow_dispatch: null
permissions: { contents: read }
defaults: { run: { shell: pwsh } }
jobs:
  path:
    name: PATH (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    steps:
      - uses: actions/checkout@v7
      - name: Add an old Ruby entry and unrelated tools
        run: |
          $PSDefaultParameterValues['*:Encoding'] = 'utf8NoBOM'
          foreach ($tool in @('old', 'inherited', 'before', 'after')) {
            $name     = $tool -eq 'old' ? 'old-ruby' : "$tool-tool"
            $dir      = Join-Path $env:RUNNER_TEMP "path-test/$name/bin"
            $toolPath = Join-Path $dir "path-test-$tool"
            New-Item -ItemType Directory -Force $dir | Out-Null

            if ($IsWindows) {
              $toolPath += '.cmd'
              Set-Content $toolPath "@echo $tool" -Encoding ascii
            } else {
              Set-Content $toolPath "#!/bin/sh`necho $tool"
              chmod +x $toolPath
              if ($LASTEXITCODE) { '::error::Could not make the test tool executable'; exit 1 }
            }
            $testEnv = "PATH_TEST_{0}={1}" -f $tool.ToUpper(), $dir
            Add-Content -Path $env:GITHUB_ENV -Value $testEnv
          }
          $old       = Join-Path $env:RUNNER_TEMP 'path-test/old-ruby/bin'
          $before    = Join-Path $env:RUNNER_TEMP 'path-test/before-tool/bin'
          $inherited = Join-Path $env:RUNNER_TEMP 'path-test/inherited-tool/bin'
          $testPath  = 'PATH={0}' -f (@($old, $inherited, $env:PATH) -join [IO.Path]::PathSeparator)

          Add-Content -Path $env:GITHUB_ENV  -Value $testPath
          Add-Content -Path $env:GITHUB_PATH -Value $before

      - uses: ./
        id: ruby
        with: { ruby-version: "3.4", bundler: none }

      - name: PowerShell / after setup-ruby
        id: shell-before
        env:
          EXPECTED_RUBY_PREFIX: "${{ steps.ruby.outputs.ruby-prefix }}"
          TOOLS: "inherited,before"
        run: &check-path |
          $escapeData = { param([string]$s) $s.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A') }
          $phase = $env:PATH_TEST_AFTER_ADDED -eq 'true' ? 'after later PATH addition' : 'after setup-ruby'
          $title = (&$escapeData "$env:RUNNER_OS / PowerShell / $phase").Replace(':', '%3A').Replace(',', '%2C')
          $tools = $env:TOOLS -split ','
          $toolCounts = @()
          $diagnostic = ''
          try {
            $dirs = $env:PATH -split [IO.Path]::PathSeparator
            if ($dirs -contains $env:PATH_TEST_OLD)                      { throw 'Old Ruby entry remains on PATH'     }
            if (Get-Command path-test-old -ErrorAction SilentlyContinue) { throw 'Old gem command can still be found' }

            foreach ($tool in $tools) {
              $dir = [Environment]::GetEnvironmentVariable("PATH_TEST_$($tool.ToUpper())")
              $matchingEntries = @(for ($i = 0; $i -lt $dirs.Count; $i++) {
                if ($dirs[$i] -eq $dir) { "Entry $($i + 1): $($dirs[$i])" }
              })
              $toolCounts += "$tool-tool=$($matchingEntries.Count)"
              if ($matchingEntries.Count -ne 1) {
                $details = $matchingEntries.Count ? ($matchingEntries -join "`n") : "Missing: $dir"
                throw (@(
                  "$tool-tool: expected 1 PATH entry, found $($matchingEntries.Count)."
                  $details
                ) -join "`n")
              }
              $output = &"path-test-$tool"
              if ($LASTEXITCODE -or ($output -ne $tool)) { throw "$tool tool did not run correctly"      }
            }
            $ruby = ruby -rjson -rrbconfig -e 'puts JSON.generate(version: RUBY_VERSION, executable: RbConfig.ruby)'
            if ($LASTEXITCODE) { throw 'Ruby failed to run' }

            $actual     = ConvertFrom-Json $ruby
            $executable = $IsWindows ? 'ruby.exe' : 'ruby'
            $expected   = Join-Path $env:EXPECTED_RUBY_PREFIX "bin/$executable"
            if (
              ([IO.Path]::GetFullPath($actual.executable) -ne [IO.Path]::GetFullPath($expected)) -or
              $actual.version -notmatch '^3\.4\.'
            ) { throw "Unexpected Ruby: {0}" -f $ruby }
            $diagnostic = "Ruby $($actual.version); PATH entries: $($toolCounts -join ', ').`nInterpreter: $($actual.executable)"
            "Ruby: {0}`nPATH: {1}" -f $ruby, $env:PATH
            "::notice title=$($title)::PATH checks passed."
          } catch {
            $diagnostic = $_.Exception.Message
            "::error title=$($title)::$(&$escapeData $diagnostic)"
            exit 1
          } finally {
            $json = ConvertTo-Json -InputObject $diagnostic -Compress
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "diagnostic=$json" -Encoding utf8NoBOM
          }

      - name: JavaScript / after setup-ruby
        id: action-before
        if: ${{ !cancelled() && steps.ruby.outcome == 'success' }}
        uses: $/.github/actions/check-path
        env: { EXPECTED_RUBY_PREFIX: "${{ steps.ruby.outputs.ruby-prefix }}" }

      - name: Add another tool for later steps
        id: add-tool
        if: ${{ !cancelled() && steps.ruby.outcome == 'success' }}
        run: |
          $PSDefaultParameterValues['Add-Content:Encoding'] = 'utf8NoBOM'
          Add-Content -Path $env:GITHUB_PATH -Value $env:PATH_TEST_AFTER
          Add-Content -Path $env:GITHUB_ENV  -Value 'PATH_TEST_AFTER_ADDED=true'

      - name: PowerShell / after later PATH addition
        id: shell-after
        if: ${{ !cancelled() && steps.add-tool.outcome == 'success' }}
        env:
          EXPECTED_RUBY_PREFIX: "${{ steps.ruby.outputs.ruby-prefix }}"
          TOOLS: "inherited,before,after"
        run: *check-path

      - name: JavaScript / after later PATH addition
        id: action-after
        if: ${{ !cancelled() && steps.add-tool.outcome == 'success' }}
        uses: $/.github/actions/check-path
        env: { EXPECTED_RUBY_PREFIX: "${{ steps.ruby.outputs.ruby-prefix }}" }

      - name: Summarize PATH checks
        if: always()
        env: { JOB_STATUS: "${{ job.status }}", STEPS: "${{ toJSON(steps) }}" }
        run: |
          $PSDefaultParameterValues['Add-Content:Encoding'] = 'utf8NoBOM'
          $steps = $env:STEPS | ConvertFrom-Json
          $lines = @(
            "### $env:RUNNER_OS / PATH checks: $env:JOB_STATUS"
            ''
            '| Check | Result | Finding |'
            '| --- | --- | --- |'
          )
          $details = @()
          switch -Wildcard ($steps.PSObject.Properties.Name -match '^(shell|action)-') {
            { $steps.$_.outputs.diagnostic } { $diagnostic = $steps.$_.outputs.diagnostic | ConvertFrom-Json }
            { -not $steps.$_.outputs.diagnostic } { $diagnostic = $steps.$_.outcome -eq 'skipped' ? 'Not run.' : 'No diagnostic recorded; see the step log.' }
            '*' {
              $step = $steps.$_
              $parts = $diagnostic -split '\r?\n', 2
              $finding = [Net.WebUtility]::HtmlEncode($parts[0]).Replace('|', '&#124;')
              $lines += "| $_ | $($step.outcome) | $finding |"
              if ($parts.Count -gt 1) {
                $text = [Net.WebUtility]::HtmlEncode($diagnostic)
                $details += @('', "<details><summary>$_ — details</summary>", '', "<pre>$text</pre>", '', '</details>')
              }
            }
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value (($lines + $details) -join "`n")
